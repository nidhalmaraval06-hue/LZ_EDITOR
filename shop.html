<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LZ STORE</title><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800;900&family=Orbitron:wght@700;900&display=swap" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><style>
:root{color-scheme:dark;--purple:#a66cff;--gold:#f3c76a}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -10%,#38205c,#100b1b 52%,#08060d);color:#f8f3ff;font-family:Cairo,sans-serif;min-height:100vh;padding:24px}.wrap{max-width:1050px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:26px}.brand{font:900 24px Orbitron;color:#d6b5ff}.balance{background:#21172e;border:1px solid #69459b;padding:10px 16px;border-radius:14px;color:#f6d77f;font-weight:900}.intro{text-align:center;margin:24px 0 34px}.shop-logo{display:block;width:min(340px,78vw);height:auto;max-height:310px;object-fit:contain;margin:0 auto 8px;filter:drop-shadow(0 0 24px #8e35ff66)}.intro h1{font-size:clamp(28px,5vw,48px);margin:0;background:linear-gradient(90deg,#fff,#d2aaff,#ffd875);background-clip:text;color:transparent}.intro p{color:#b9abc9}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px}.card{background:linear-gradient(150deg,#241832,#100d18);border:1px solid #49305e;border-radius:22px;padding:22px;text-align:center;box-shadow:0 18px 50px #0007}.card img{width:120px;height:120px;object-fit:contain;filter:drop-shadow(0 0 18px #9a59ff55)}.card h2{margin:10px 0 3px}.desc{color:#b9abc9;font-size:13px;min-height:42px}.price{color:#f5d27b;font-weight:900;font-size:22px;margin:14px}.btn{border:0;border-radius:12px;padding:12px 20px;font:800 14px Cairo;cursor:pointer;background:linear-gradient(100deg,#9251df,#bd8cff);color:white;width:100%}.btn:disabled{opacity:.5;cursor:not-allowed}.owned{background:#254432;color:#9ff0ba;padding:10px;border-radius:12px;font-weight:800}.note{text-align:center;color:#988ba8;margin-top:25px;font-size:12px}a{color:#d6b5ff}
</style></head><body><main class="wrap"><header class="top"><a href="designers.html">← العودة للموقع</a><div class="brand">LZ STORE</div><div class="balance"><img src="lz-coins.png" alt="" style="width:27px;height:27px;object-fit:contain;vertical-align:middle"> <span id="balance">—</span> LZ COINS</div></header><section class="intro"><img class="shop-logo" src="shop-logo.png" alt="LZ EDITORS SHOP"><h1>متجر LZ الحصري</h1><p>اشترِ رتب OG وVIP باستخدام عملات LZ الخاصة بك.</p></section><div id="status" class="note">جاري تحميل المتجر...</div><section class="grid" id="products"></section><p class="note">المشتريات والرصيد محفوظان في حسابك، والأسعار معتمدة من إدارة LZ.</p></main><script>
(()=>{'use strict';const API='https://lz-editor-qoa6.onrender.com',URL='https://gotgssqdkercujjzisdm.supabase.co',KEY='sb_publishable_4NyoLY_J46KA6Lt2T4PNBg_Bzy8bT3r';const sb=window.supabase.createClient(URL,KEY);let token='',owned=[];const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(path,opts={}){const r=await fetch(API+path,{...opts,headers:{...(opts.body?{'Content-Type':'application/json'}:{}),Authorization:'Bearer '+token}});const b=await r.json().catch(()=>({}));if(!r.ok)throw Error(b.error||'حدث خطأ');return b}function render(items){$('products').innerHTML=items.map(p=>{const has=owned.some(x=>x.product_code===p.code);return `<article class="card"><img src="${p.image}" alt="${esc(p.name)}"><h2>${esc(p.name)}</h2><div class="desc">${esc(p.description||'عنصر حصري من LZ EDITORS')}</div><div class="price"><img src="lz-coins.png" alt="" style="width:24px;height:24px;object-fit:contain;vertical-align:middle"> ${Number(p.price).toLocaleString('ar')} LZ</div>${has?'<div class="owned">✓ تملكه بالفعل</div>':`<button class="btn" data-buy="${esc(p.code)}">شراء الآن</button>`}</article>`}).join('');}async function start(){try{const {data:{session}}=await sb.auth.getSession();if(!session?.access_token)throw Error('سجّل الدخول بحساب Discord أولاً ثم افتح المتجر.');token=session.access_token;const [items,me]=await Promise.all([fetch(API+'/api/shop/catalog').then(r=>r.json()),api('/api/shop/me')]);owned=me.purchases||[];$('balance').textContent=Number(me.balance).toLocaleString('ar');render(items);$('status').textContent='اختر العنصر الذي تريد شراءه.';}catch(e){$('status').textContent=e.message;}}$('products').addEventListener('click',async e=>{const b=e.target.closest('[data-buy]');if(!b)return;if(!confirm('تأكيد شراء هذا العنصر؟'))return;b.disabled=true;b.textContent='جاري الشراء...';try{const result=await api('/api/shop/purchase',{method:'POST',body:JSON.stringify({code:b.dataset.buy})});$('balance').textContent=Number(result.balance).toLocaleString('ar');await start();$('status').textContent='تم الشراء بنجاح!';}catch(err){alert(err.message);b.disabled=false;b.textContent='شراء الآن';}});start();})();
</script></body></html>
