<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090510"><title>LZ EDITORS | Banned</title><link rel="icon" href="logo.ban.png"><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Orbitron:wght@700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0,#40106466,transparent 55%),#090510;color:#fff;font-family:Cairo,sans-serif;display:grid;place-items:center;padding:22px}.card{width:min(760px,100%);border:1px solid #9e45ff77;border-radius:26px;padding:clamp(20px,5vw,42px);background:linear-gradient(145deg,#1c1029f5,#0d0916f7);box-shadow:0 20px 90px #000b,0 0 55px #a02cff20;text-align:center;overflow:hidden}.logo{width:min(240px,65vw);height:auto;max-height:220px;object-fit:contain;filter:drop-shadow(0 0 22px #9b39ff55)}.tag{display:inline-block;margin:15px 0 8px;padding:5px 16px;border:1px solid #ff465b88;border-radius:30px;color:#ff6677;background:#ff244415;font:800 12px Orbitron,sans-serif;letter-spacing:2px}h1{font-size:clamp(25px,5vw,39px);margin:8px 0;color:#fff}h1 span{color:#ff526a}.desc{color:#bdb0cb;line-height:2;margin:0 auto 22px}.details{display:grid;grid-template-columns:1fr 1fr;gap:12px;text-align:right;margin:22px 0}.item{padding:15px;border:1px solid #8b4acb55;border-radius:15px;background:#ffffff06;min-width:0}.item small{display:block;color:#b99bd5;margin-bottom:5px}.item strong{overflow-wrap:anywhere}.reason{grid-column:1/-1}.appeal{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:15px;border-radius:15px;background:linear-gradient(100deg,#7040e9,#9b35e8);color:#fff;text-decoration:none;font-weight:900;box-shadow:0 10px 30px #8239e955;transition:.2s}.appeal:hover{transform:translateY(-2px);filter:brightness(1.1)}.foot{color:#776b85;font-size:11px;margin-top:20px;letter-spacing:2px;font-family:Orbitron,sans-serif}@media(max-width:520px){.details{grid-template-columns:1fr}.reason{grid-column:auto}.card{border-radius:20px}.logo{max-height:170px}}</style></head><body><main class="card"><img class="logo" src="logo.ban.png" alt="LZ EDITORS BANNED" onerror="this.onerror=null;this.src='logo.png'"><div class="tag">ACCESS RESTRICTED</div><h1><span>تم حظرك</span> من LZ EDITORS</h1><p class="desc">لا يمكنك استخدام الموقع حالياً. راجع تفاصيل الحظر أدناه، وإذا كنت تعتقد أن القرار غير عادل يمكنك تقديم طعن للإدارة عبر Discord.</p><section class="details"><div class="item"><small><i class="fa-regular fa-calendar"></i> تاريخ انتهاء الحظر</small><strong id="expires">—</strong></div><div class="item"><small><i class="fa-regular fa-clock"></i> المدة المتبقية</small><strong id="remaining">—</strong></div><div class="item reason"><small><i class="fa-solid fa-triangle-exclamation"></i> سبب الحظر</small><strong id="reason">غير محدد</strong></div></section><a class="appeal" href="https://discord.com/channels/1528679532637454376/1565737674357342228" target="_blank" rel="noopener noreferrer"><i class="fa-brands fa-discord"></i> تقديم طعن عبر Discord</a><div class="foot">LZ EDITORS • CREATIVE COMMUNITY</div></main><script>(()=>{let b={};try{b=JSON.parse(sessionStorage.getItem('lz_ban_info')||'{}')}catch{};const reason=document.getElementById('reason'),expires=document.getElementById('expires'),remaining=document.getElementById('remaining');reason.textContent=b.reason||'لم يتم تحديد السبب';if(!b.expires_at){expires.textContent='حظر دائم';remaining.textContent='غير محددة';return}const end=new Date(b.expires_at);expires.textContent=end.toLocaleString('ar');function update(){let ms=end-Date.now();if(ms<=0){remaining.textContent='انتهى الحظر — حدّث الصفحة أو سجّل الدخول مجدداً';return}let d=Math.floor(ms/86400000),h=Math.floor(ms%86400000/3600000),m=Math.floor(ms%3600000/60000);remaining.textContent=[d?d+' يوم':'',h?h+' ساعة':'',m?m+' دقيقة':''].filter(Boolean).join(' و ')||'أقل من دقيقة'}update();setInterval(update,60000)})();</script></body></html>
